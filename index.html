<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCA Smart Queue System</title>
  <meta name="description" content="KCA student queue and service desk management system.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .kca-blue { background-color: #0A2A6B; }
    .display-shell {
      background: #071b48;
      background-image: linear-gradient(135deg, rgba(10, 42, 107, 0.98), rgba(4, 19, 54, 0.98));
      border-top: 8px solid #F4B400;
      box-shadow: 0 24px 60px rgba(10, 42, 107, 0.25);
    }
    .display-kicker { color: #F4B400; letter-spacing: 0.28em; }
    .desk-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.12);
    }
    .desk-card.is-live { border-color: #F4B400; }
    .queue-number { color: #7DE2A8; text-shadow: 0 0 24px rgba(125, 226, 168, 0.25); }
    .live-dot {
      width: 0.55rem;
      height: 0.55rem;
      background: #7DE2A8;
      box-shadow: 0 0 0 5px rgba(125, 226, 168, 0.12);
      animation: live-pulse 1.8s ease-in-out infinite;
    }
    .next-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .next-item:last-child { border-bottom: 0; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    body {
      background: linear-gradient(rgba(243, 246, 250, 0.92), rgba(243, 246, 250, 0.92)), url('icon.svg') center/38vmin no-repeat fixed;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">

<nav class="kca-blue text-white p-4 flex justify-between items-center shadow-lg">
  <div class="flex items-center gap-3">
    <div class="bg-white text-blue-900 font-bold rounded-full w-10 h-10 flex items-center justify-center">KCA</div>
    <h1 class="text-xl font-bold">Smart Queue System</h1>
  </div>
  <div class="space-x-2">
    <button onclick="show('student')" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">Student</button>
    <button onclick="show('staff')" class="bg-green-600 px-4 py-2 rounded hover:bg-green-700">Staff</button>
    <button onclick="show('display')" class="bg-red-600 px-4 py-2 rounded hover:bg-red-700">Display</button>
  </div>
</nav>

<div class="container mx-auto p-6">

  <div id="student">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">Request Queue Number</h2>
      <input id="name" class="w-full p-3 border rounded mb-4" placeholder="Full Name">
      <input id="reg" class="w-full p-3 border rounded mb-4" placeholder="Reg No: KCA/123/2024">
      <select id="service" class="w-full p-3 border rounded mb-4">
        <option>Finance Department</option><option>Exams Office</option><option>HOD Office</option><option>Admissions</option>
      </select>
      <select id="desk" class="w-full p-3 border rounded mb-4">
        <option value="Desk 1">Desk 1</option>
        <option value="Desk 2">Desk 2</option>
        <option value="Desk 3">Desk 3</option>
      </select>
      <button onclick="requestQueue()" class="w-full kca-blue text-white p-3 rounded font-bold text-lg hover:opacity-90">REQUEST NUMBER</button>
      <p id="status" class="mt-4 text-center text-green-600 font-semibold"></p>
    </div>
  </div>

  <div id="staff" class="hidden">
    <h2 class="text-2xl font-bold mb-4">Staff Dashboard</h2>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div id="desk1-panel" class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded"></div>
      <div id="desk2-panel" class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded"></div>
      <div id="desk3-panel" class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded"></div>
    </div>

    <h3 class="text-xl font-semibold mb-2">Pending & Approved Requests</h3>
    <div id="pendingList" class="space-y-3"></div>
  </div>

  <div id="display" class="hidden display-shell text-white min-h-[80vh] rounded-2xl p-6 sm:p-10">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 border-b border-white/20 pb-6">
      <div>
        <p class="display-kicker text-xs font-bold uppercase">KCA University</p>
        <h1 class="mt-2 text-4xl sm:text-6xl font-black tracking-tight">NOW SERVING</h1>
      </div>
      <div class="flex items-center gap-3 text-sm font-semibold text-blue-100">
        <span class="live-dot rounded-full"></span>
        <span>LIVE QUEUE</span>
      </div>
    </div>
    <div class="grid md:grid-cols-3 gap-5 mt-8">
      <div id="desk1-card" class="desk-card rounded-xl p-6"><div class="flex items-center justify-between"><p class="text-lg font-bold text-blue-100">DESK 1</p><span id="desk1-state" class="text-xs font-bold text-blue-100">READY</span></div><p id="desk1-now" class="queue-number mt-4 text-7xl font-black">--</p></div>
      <div id="desk2-card" class="desk-card rounded-xl p-6"><div class="flex items-center justify-between"><p class="text-lg font-bold text-blue-100">DESK 2</p><span id="desk2-state" class="text-xs font-bold text-blue-100">READY</span></div><p id="desk2-now" class="queue-number mt-4 text-7xl font-black">--</p></div>
      <div id="desk3-card" class="desk-card rounded-xl p-6"><div class="flex items-center justify-between"><p class="text-lg font-bold text-blue-100">DESK 3</p><span id="desk3-state" class="text-xs font-bold text-blue-100">READY</span></div><p id="desk3-now" class="queue-number mt-4 text-7xl font-black">--</p></div>
    </div>
    <div class="mt-8 rounded-xl bg-white/10 p-5">
      <div class="flex items-center justify-between border-b border-white/20 pb-4">
        <h2 class="text-2xl font-bold text-yellow-300">UP NEXT</h2>
        <span class="text-xs font-bold uppercase tracking-widest text-blue-100">Please listen for your name</span>
      </div>
      <div id="nextList" class="mt-2 text-lg"></div>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = 'kca_queue_requests_v1';

  function getQueueRequests(){
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveQueueRequests(requests){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
  }

  function show(role){
    ['student','staff','display'].forEach(r => document.getElementById(r).classList.add('hidden'));
    document.getElementById(role).classList.remove('hidden');
    if (role === 'staff') loadStaff();
    if (role === 'display') loadDisplay();
  }

  function requestQueue(){
    const nameField = document.getElementById('name');
    const regField = document.getElementById('reg');
    const serviceField = document.getElementById('service');
    const deskField = document.getElementById('desk');
    const statusField = document.getElementById('status');

    const requestedName = nameField.value.trim();
    const requestedReg = regField.value.trim();

    if (!requestedName || !requestedReg) {
      statusField.innerText = 'Please enter your full name and registration number.';
      statusField.className = 'mt-4 text-center text-red-600 font-semibold';
      return;
    }

    const requests = getQueueRequests();
    const deskRequests = requests.filter(r => r.desk === deskField.value && ['pending', 'approved', 'serving'].includes(r.status));
    const nextNumber = deskRequests.length + 1;

    const newRequest = {
      id: Date.now().toString(),
      name: requestedName,
      regNo: requestedReg,
      service: serviceField.value,
      desk: deskField.value,
      queueNumber: nextNumber,
      status: 'pending',
      requestedAt: new Date().toISOString()
    };

    requests.push(newRequest);
    saveQueueRequests(requests);
    statusField.innerText = `✅ Request Sent! Your Queue No: ${nextNumber} at ${deskField.value}`;
    statusField.className = 'mt-4 text-center text-green-600 font-semibold';
    nameField.value = '';
    regField.value = '';

    if (document.getElementById('staff').classList.contains('hidden') === false) {
      loadStaff();
    }
    if (document.getElementById('display').classList.contains('hidden') === false) {
      loadDisplay();
    }
  }

  function loadStaff(){
    const pendingListEl = document.getElementById('pendingList');
    const requests = getQueueRequests().sort((a, b) => new Date(a.requestedAt) - new Date(b.requestedAt));

    ['Desk 1', 'Desk 2', 'Desk 3'].forEach(desk => {
      const serving = requests.find(r => r.desk === desk && r.status === 'serving');
      const panel = document.getElementById(`${desk.toLowerCase().replace(/\s+/g, '')}-panel`);

      if (!panel) return;

      if (!serving) {
        panel.innerHTML = `<p class="font-bold">${desk}</p><p class="text-gray-600">No one being served</p>`;
      } else {
        panel.innerHTML = `
          <p class="font-bold text-lg">${desk}</p>
          <p class="font-semibold text-lg">NOW SERVING: #${serving.queueNumber}. ${serving.name}</p>
          <button onclick="update('${serving.id}', 'done')" class="mt-2 bg-red-500 text-white px-4 py-1 rounded">MARK DONE</button>
        `;
      }
    });

    const pending = requests.filter(r => ['pending', 'approved'].includes(r.status));

    if (!pending.length) {
      pendingListEl.innerHTML = '<p class="text-gray-500">No pending requests.</p>';
      return;
    }

    pendingListEl.innerHTML = pending.map(d => {
      const btn = d.status === 'pending'
        ? `<button onclick="update('${d.id}', 'approved')" class="bg-green-500 text-white px-4 py-2 rounded">ACCEPT</button>`
        : `<button onclick="update('${d.id}', 'serving')" class="bg-blue-500 text-white px-4 py-2 rounded">CALL NEXT</button>`;

      return `
        <div class="bg-white p-4 rounded shadow flex justify-between items-center">
          <div>
            <p class="font-bold text-lg">#${d.queueNumber} - ${d.name}</p>
            <p class="text-gray-600">${d.regNo} | ${d.service} | ${d.desk} | <span class="capitalize">${d.status}</span></p>
          </div>
          ${btn}
        </div>`;
    }).join('');
  }

  function announceDeskCall(request){
    if (!('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();
    const announcement = new SpeechSynthesisUtterance(
      `Attention ${request.name}, queue number ${request.queueNumber}. Please proceed to ${request.desk}.`
    );
    announcement.lang = 'en-US';
    announcement.rate = 0.9;
    window.speechSynthesis.speak(announcement);
  }

  function update(id, newStatus){
    const requests = getQueueRequests();
    const index = requests.findIndex(r => r.id === id);

    if (index === -1) return;

    requests[index].status = newStatus;
    saveQueueRequests(requests);
    if (newStatus === 'serving') {
      announceDeskCall(requests[index]);
    }
    loadStaff();
    loadDisplay();
  }

  function loadDisplay(){
    const requests = getQueueRequests().sort((a, b) => new Date(a.requestedAt) - new Date(b.requestedAt));

    ['Desk 1', 'Desk 2', 'Desk 3'].forEach(desk => {
      const serving = requests.find(r => r.desk === desk && r.status === 'serving') || null;
      const deskKey = desk.toLowerCase().replace(/\s+/g, '');
      const nowEl = document.getElementById(`${deskKey}-now`);
      const cardEl = document.getElementById(`${deskKey}-card`);
      const stateEl = document.getElementById(`${deskKey}-state`);
      if (nowEl) {
        nowEl.innerText = serving ? `#${serving.queueNumber}` : '--';
      }
      if (cardEl) cardEl.classList.toggle('is-live', Boolean(serving));
      if (stateEl) stateEl.innerText = serving ? 'ACTIVE' : 'READY';
    });

    const next = requests.filter(r => r.status === 'approved').slice(0, 8);
    nextList.innerHTML = next.length
      ? next.map((d, i) => `<div class="next-item"><span class="font-bold text-yellow-300">${String(i + 1).padStart(2, '0')}</span><span class="flex-1 font-semibold">${d.name}</span><span class="text-sm text-blue-100">${d.desk} · #${d.queueNumber}</span></div>`).join('')
      : '<span class="block py-4 text-blue-100">NO APPROVED REQUESTS</span>';
  }

  show('student');
</script>
</body>
</html>
