<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KCA Emergency</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{background:linear-gradient(135deg,#eef3f9,#f8fafc)}.kca-navy{background:#0a2a6b}.kca-gold{color:#f4b400}.kca-gold-bg{background:#f4b400}.kca-panel{border-top:4px solid #0a2a6b}.kca-input:focus{outline:2px solid #f4b400;outline-offset:1px}</style></head><body class="text-slate-800">
<header class="kca-navy text-white p-4 flex justify-between"><div class="flex gap-3 items-center"><div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-[#0A2A6B] font-black">KCA</div><div><h1 class="font-black">KCA UNIVERSITY</h1><p class="text-xs text-blue-100">Emergency Management System</p></div></div><button id="roleToggle" class="border border-[#F4B400] text-[#F4B400] px-3 py-1 rounded-full text-xs">Security View</button></header>
<main class="max-w-6xl mx-auto p-4 grid lg:grid-cols-3 gap-4">
<div class="lg:col-span-2 space-y-4">
<div class="kca-panel bg-white rounded-2xl p-6 shadow text-center"><p class="kca-gold text-xs font-bold tracking-widest">EMERGENCY CHANNEL</p><h2 class="font-bold mt-1 mb-3 text-[#0A2A6B]">EMERGENCY? TAP SOS</h2><button id="sosBtn" class="w-40 h-40 rounded-full bg-red-600 text-white font-black text-2xl shadow-2xl mx-auto">SOS</button><p id="sosStatus" class="text-xs mt-4">Hold 3 sec - Sends GPS to Security</p></div>
<div class="kca-panel bg-white rounded-2xl p-5 shadow"><h3 class="font-bold mb-3 text-[#0A2A6B]">Report Incident</h3><div class="grid grid-cols-2 gap-2 mb-3"><button data-type="Medical" class="typeBtn border-2 border-slate-200 p-3 rounded-xl">Medical</button><button data-type="Security" class="typeBtn border-2 border-slate-200 p-3 rounded-xl">Security</button><button data-type="Fire" class="typeBtn border-2 border-slate-200 p-3 rounded-xl">Fire</button><button data-type="Other" class="typeBtn border-2 border-slate-200 p-3 rounded-xl">Other</button></div><input id="locationInput" placeholder="Location e.g Block C 204" class="kca-input w-full border p-3 rounded-xl mb-2"><textarea id="descInput" placeholder="Describe..." class="kca-input w-full border p-3 rounded-xl mb-3 h-20"></textarea><div class="flex gap-2"><input id="nameInput" placeholder="Your Name" class="kca-input flex-1 border p-3 rounded-xl"><input id="phoneInput" placeholder="Phone" class="kca-input flex-1 border p-3 rounded-xl"></div><button id="submitReport" class="kca-navy text-white py-3 rounded-xl mt-3 font-bold w-full border-b-4 border-[#F4B400]">Submit Report</button></div></div>
<div class="kca-panel bg-white rounded-2xl p-5 shadow"><div class="flex justify-between"><div><h3 class="font-bold text-[#0A2A6B]">Live Incidents</h3><p id="feedStatus" class="text-xs text-slate-500">Reports are stored on this device</p></div><span id="incidentCount" class="bg-[#F4B400] text-[#0A2A6B] px-2 py-1 rounded-full text-xs font-bold h-fit">0 Active</span></div><div id="incidentList" class="mt-3"></div><button id="clearAll" class="w-full mt-3 text-xs text-slate-500">Clear All</button></div>
</main>
<script>
let selectedType=null;let incidents=JSON.parse(localStorage.getItem('kca_ems')||'[]');let isSecurityView=false;
let cloudReady=false;
	async function initCloud(){try{cloudReady=await kcaCloud.init();if(cloudReady){incidents=await kcaCloud.list();render();document.getElementById('feedStatus').textContent='Connected to campus security';}}catch(error){console.error(error);document.getElementById('feedStatus').textContent='Offline mode: reports are stored on this device';}}
document.querySelectorAll('.typeBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.typeBtn').forEach(x=>x.classList.remove('bg-[#8B0000]','text-white'));b.classList.add('bg-[#8B0000]','text-white');selectedType=b.dataset.type;}});
function responseLabel(status){return {new:'NEW',acknowledged:'ACKNOWLEDGED',dispatched:'RESPONDER DISPATCHED',resolved:'RESOLVED'}[status||'new'];}
function setIncidentStatus(index,status){if(!incidents[index])return;incidents[index].status=status;incidents[index].updatedAt=new Date().toLocaleTimeString();render();}
function render(){const list=document.getElementById('incidentList');const count=document.getElementById('incidentCount');const feedStatus=document.getElementById('feedStatus');if(incidents.length===0){list.innerHTML='<p class="text-center text-gray-400 py-10">All clear ✅</p>';count.textContent='0 Active';feedStatus.textContent=isSecurityView?'Security response console':'Reports are stored on this device';return;}count.textContent=incidents.filter(inc=>inc.status!=='resolved').length+' Active';feedStatus.textContent=isSecurityView?'Security response console':'Reports are stored on this device';list.innerHTML=incidents.map((inc,i)=>`<div class="border-l-4 ${inc.sos?'border-red-700 bg-red-50':'border-amber-500 bg-gray-50'} p-3 rounded-r-xl mb-2"><div class="flex justify-between gap-2"><b class="text-xs">${inc.type} ${inc.sos?'• SOS':''}</b><span class="text-[10px] text-gray-500">${inc.time} · ${responseLabel(inc.status)}</span></div><p class="text-sm font-semibold mt-1">${inc.location}</p><p class="text-xs">${inc.desc}</p><p class="text-[11px]">${inc.name} • ${inc.phone}</p>${isSecurityView&&inc.status!=='resolved'?`<div class="flex flex-wrap gap-1 mt-2"><button onclick="setIncidentStatus(${i},'acknowledged')" class="bg-[#0A2A6B] text-white px-2 py-1 rounded text-[11px]">Acknowledge</button><button onclick="setIncidentStatus(${i},'dispatched')" class="bg-[#F4B400] text-[#0A2A6B] px-2 py-1 rounded text-[11px]">Dispatch responder</button><button onclick="setIncidentStatus(${i},'resolved')" class="bg-emerald-600 text-white px-2 py-1 rounded text-[11px]">Resolve</button></div>`:''}</div>`).join('');localStorage.setItem('kca_ems',JSON.stringify(incidents));}render();
document.getElementById('submitReport').onclick=async()=>{const loc=locationInput.value,desc=descInput.value,name=nameInput.value||'Anonymous',phone=phoneInput.value||'N/A';if(!selectedType||!loc||!desc){alert('Fill type, location, desc');return;}const incident={type:selectedType,location:loc,desc,name,phone,time:new Date().toLocaleTimeString(),sos:false,status:'new'};if(cloudReady){await kcaCloud.create({type:incident.type,location:incident.location,description:incident.desc,reporter_name:incident.name,phone:incident.phone,is_sos:false,status:'new'});incidents=await kcaCloud.list();}else{incidents.unshift(incident);}render();locationInput.value='';descInput.value='';alert(cloudReady?'Report sent to campus security.':'Report saved on this device.');};
let holdTimer;sosBtn.onmousedown=()=>{holdTimer=setTimeout(async()=>{navigator.geolocation.getCurrentPosition(async p=>{const location=`SOS GPS ${p.coords.latitude.toFixed(4)},${p.coords.longitude.toFixed(4)}`;if(cloudReady){await kcaCloud.create({type:'Security',location,description:'Emergency alert from SOS button.',reporter_name:nameInput.value||'Student',phone:phoneInput.value||'N/A',is_sos:true,status:'new'});incidents=await kcaCloud.list();}else{incidents.unshift({type:'Security',location,desc:'Emergency alert from SOS button.',name:nameInput.value||'Student',phone:phoneInput.value||'N/A',time:new Date().toLocaleTimeString(),sos:true,status:'new'});}render();sosStatus.textContent='SOS SENT. Security has been alerted.';},()=>alert('Enable GPS'));},3000);};sosBtn.onmouseup=()=>clearTimeout(holdTimer);
roleToggle.onclick=(e)=>{isSecurityView=!isSecurityView;e.target.textContent=isSecurityView?'Student View':'Security View';render();};
clearAll.onclick=()=>{incidents=[];render();};
initCloud();
</script></body></html>
